# Redis for eventpoll4 (EventMoot): sessions, BullMQ job queues, rate limits,
# caches. A Render private service with a persistent disk at /var/lib/redis.
#
# Until 2026-10 this file was never read (Render's Docker Command replaced the
# entrypoint), so Redis ran on defaults and wrote its snapshots to /data inside
# the container, which every restart or deploy wiped. See the Dockerfile.

port 6379
bind 0.0.0.0
# Reachable only on Render's private network.
protected-mode no

# Persist on the Render disk: an append-only file (at most ~1s of writes lost)
# plus periodic snapshots.
dir /var/lib/redis
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# BullMQ needs noeviction: a full Redis refuses writes instead of silently
# dropping queued jobs or sessions.
maxmemory 256mb
maxmemory-policy noeviction
